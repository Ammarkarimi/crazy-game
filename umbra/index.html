<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>UMBRA - Duel of Shadows</title>
  <meta name="description" content="UMBRA: Duel of Shadows. A silhouette sword-fighting game. Pick your rival, master combos, forge legendary gear.">
  <meta name="theme-color" content="#08060c">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Game"></canvas>

  <!-- Touch controls -->
  <div id="touch" aria-hidden="true">
    <div id="tZone"></div>
    <div id="tStick"><div id="tKnob"></div></div>
    <div id="tBtns">
      <button class="tb big" data-btn="attack">ATTACK</button>
      <button class="tb" data-btn="kick">KICK</button>
      <button class="tb" data-btn="heavy">HEAVY</button>
      <button class="tb" data-btn="throw">THROW</button>
      <button class="tb magic" data-btn="magic">MAGIC</button>
      <button class="tb" data-btn="roll">ROLL</button>
    </div>
    <button id="tPause" class="tb small">II</button>
  </div>

  <div id="ui">
    <!-- top bar with currencies -->
    <div id="wallet" hidden><span class="coin" id="wCoins">0</span><span class="gem" id="wGems">0</span></div>

    <section id="scr-boot" class="screen active">
      <div class="logo"><div class="mark">UMBRA</div><div class="sub">DUEL OF SHADOWS</div></div>
      <button class="btn primary big" data-act="boot">BEGIN</button>
      <p class="hint">Headphones recommended</p>
    </section>

    <section id="scr-title" class="screen">
      <div class="logo small"><div class="mark">UMBRA</div><div class="sub">DUEL OF SHADOWS</div></div>
      <div class="menu">
        <button class="btn primary" data-act="nextDuel" id="btnNext">NEXT DUEL <small id="nextInfo"></small></button>
        <button class="btn" data-act="rivals">ALL RIVALS <small>choose any rival</small></button>
        <button class="btn" data-act="forge">FORGE <small>buy &amp; upgrade gear</small></button>
        <button class="btn" data-act="dojo">DOJO <small>fighters</small></button>
        <button class="btn" data-act="versus">VERSUS <small>2 players</small></button>
        <button class="btn" data-act="training">TRAINING</button>
        <button class="btn" data-act="achievements">HONORS</button>
        <button class="btn" data-act="settings">SETTINGS</button>
        <button class="btn" data-act="howto">HOW TO PLAY</button>
        <button class="btn danger" data-act="quit" id="btnQuit" hidden>QUIT</button>
        <button class="btn" data-act="install" id="btnInstall" hidden>INSTALL APP</button>
      </div>
      <div class="me" id="meCard"></div>
      <div class="ver" id="verLabel"></div>
    </section>

    <section id="scr-rivals" class="screen wide">
      <header><button class="btn ghost" data-act="back">&larr;</button><h2>CHOOSE YOUR RIVAL</h2><div class="pw" id="myPower"></div></header>
      <div class="tabs" id="tierTabs"></div>
      <div class="split">
        <div class="grid" id="rivalGrid"></div>
        <aside class="detail" id="rivalDetail"></aside>
      </div>
    </section>

    <section id="scr-dojo" class="screen wide">
      <header><button class="btn ghost" data-act="back">&larr;</button><h2>DOJO</h2><div class="pw"></div></header>
      <div class="fighters" id="fighterList"></div>
    </section>

    <section id="scr-forge" class="screen wide">
      <header><button class="btn ghost" data-act="back">&larr;</button><h2>FORGE</h2><div class="pw" id="forgePower"></div></header>
      <div class="tabs" id="slotTabs"></div>
      <div class="split forge">
        <div class="items" id="itemList"></div>
        <aside class="detail" id="itemDetail"></aside>
      </div>
    </section>

    <section id="scr-versus" class="screen wide">
      <header><button class="btn ghost" data-act="back">&larr;</button><h2>VERSUS</h2><div class="pw"></div></header>
      <div class="vs" id="vsPanel"></div>
    </section>

    <section id="scr-results" class="screen">
      <div class="panel results" id="resultPanel"></div>
    </section>

    <section id="scr-pause" class="screen">
      <div class="panel">
        <h2>PAUSED</h2>
        <div class="menu">
          <button class="btn primary" data-act="resume">RESUME</button>
          <button class="btn" data-act="dummy" id="btnDummy" hidden>DUMMY: STAND</button>
          <button class="btn" data-act="movelist">MOVE LIST</button>
          <button class="btn danger" data-act="forfeit" id="btnForfeit">QUIT MATCH</button>
        </div>
      </div>
    </section>

    <section id="scr-settings" class="screen">
      <div class="panel">
        <h2>SETTINGS</h2>
        <div id="settingsList" class="settings"></div>
        <div class="row"><button class="btn danger small" data-act="reset">ERASE PROGRESS</button><button class="btn primary" data-act="back">DONE</button></div>
      </div>
    </section>

    <section id="scr-howto" class="screen">
      <div class="panel wide-panel">
        <h2>HOW TO PLAY</h2>
        <div class="howto" id="howtoBody"></div>
        <div class="row"><button class="btn" data-act="tutorial">PLAY THE TUTORIAL</button><button class="btn primary" data-act="back">GOT IT</button></div>
      </div>
    </section>

    <section id="scr-achievements" class="screen">
      <div class="panel wide-panel">
        <h2>HONORS</h2>
        <div class="honors" id="honorList"></div>
        <div class="row"><button class="btn primary" data-act="back">BACK</button></div>
      </div>
    </section>

    <div id="toasts"></div>
    <div id="rotate"><div><div class="rot-icon">&#10227;</div>Turn your device sideways to fight</div></div>
  </div>

  <script src="src/util.js"></script>
  <script src="src/pwa.js"></script>
  <script src="src/data.js"></script>
  <script src="src/moves.js"></script>
  <script src="src/save.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/render.js"></script>
  <script src="src/fighter.js"></script>
  <script src="src/ai.js"></script>
  <script src="src/tutorial.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/stage.js"></script>
  <script src="src/game.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/input.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
