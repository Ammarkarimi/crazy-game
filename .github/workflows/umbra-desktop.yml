name: Build UMBRA desktop apps

# Builds UMBRA for Windows, macOS and Linux and publishes a GitHub Release.
# Runs when a tag like umbra-v1.0.0 is pushed, or by hand from the Actions tab.
on:
  push:
    tags: ['umbra-v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: umbra

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: umbra/package-lock.json

      - run: npm ci

      - name: Build app
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: umbra-${{ matrix.os }}
          if-no-files-found: error
          path: |
            umbra/release/*.exe
            umbra/release/*.dmg
            umbra/release/*.AppImage

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        run: echo "tag=umbra-v$(node -p "require('./umbra/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Name the downloads
        run: |
          cd out
          v=$(node -p "require('../umbra/package.json').version")
          for f in *; do
            case "$f" in
              *Setup*.exe)   mv "$f" "UMBRA-v${v}-Windows-Setup.exe" ;;
              *.exe)         mv "$f" "UMBRA-v${v}-Windows-Portable.exe" ;;
              *.dmg)         mv "$f" "UMBRA-v${v}-macOS.dmg" ;;
              *.AppImage)    mv "$f" "UMBRA-v${v}-Linux.AppImage" ;;
            esac
          done
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: UMBRA ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.tag }}
          make_latest: false
          body: |
            **UMBRA: Duel of Shadows** - silhouette sword fighting.

            | Computer | Download |
            |---|---|
            | Windows 10/11 (installer) | `UMBRA-*-Windows-Setup.exe` |
            | Windows (no install, just run) | `UMBRA-*-Windows-Portable.exe` |
            | Mac (Apple Silicon and Intel) | `UMBRA-*-macOS.dmg` |
            | Linux | `UMBRA-*-Linux.AppImage` (make it executable, then run) |
          files: out/*
          fail_on_unmatched_files: true
